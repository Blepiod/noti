name: Internship alerts

on:
  schedule:
    # Every five minutes, offset from the start of the hour to reduce congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a test notification to confirm phone setup
        type: boolean
        default: false

# Only this job needs writes, to persist the notification queue on noti-state.
permissions:
  contents: read

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check listings and persist notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SEND_TEST_NOTIFICATION: ${{ inputs.send_test_notification && 'true' || 'false' }}
        run: python actions_runner.py
